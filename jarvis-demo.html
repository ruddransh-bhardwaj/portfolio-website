<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Demo</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0a0a0a;
    font-family:Poppins,sans-serif;
    color:white;
}

.container{
    width:420px;
    padding:40px;
    border-radius:25px;
    background:rgba(23,23,23,.8);
    border:1px solid rgba(255,255,255,.08);
    text-align:center;
}

h1{
    margin-bottom:10px;
}

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    cursor:pointer;
    font-size:1rem;
    background:white;
    font-weight:600;
}

#status{
    margin-top:20px;
    color:#c084fc;
}

#response{
    margin-top:20px;
    padding:18px;
    border-radius:15px;
    background:#171717;
    min-height:70px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎤 Jarvis Demo</h1>

<p>Click below and speak</p>

<button id="btn">
Start Listening
</button>

<div id="status">
Ready
</div>

<div id="response">
Waiting...
</div>

</div>
<script>

const btn = document.getElementById("btn");
const status = document.getElementById("status");
const response = document.getElementById("response");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;
recognition.interimResults = false;
recognition.maxAlternatives = 1;

let listening = false;
let commandProcessed = false;

function speak(text){

    speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.rate = 1;

    speechSynthesis.speak(speech);
}

function reply(command){

command = command.trim().toLowerCase();

if(command.includes("youtube")){
    window.open(
        "https://youtube.com",
        "_blank"
    );
    return "Opening YouTube";
}

if(command.includes("google")){
    window.open(
        "https://google.com",
        "_blank"
    );
    return "Opening Google";
}

if(command.includes("github")){
    window.open(
        "https://github.com",
        "_blank"
    );
    return "Opening GitHub";
}

if(command.includes("time")){
    return new Date()
    .toLocaleTimeString();
}

return "You said " + command;
}

btn.onclick = () => {

    if(listening) return;

    listening = true;
    commandProcessed = false;

    btn.disabled = true;

    status.innerHTML =
    "Listening...";

    recognition.start();
};

recognition.onresult = (e) => {

    if(commandProcessed) return;

    commandProcessed = true;

    recognition.stop();

    const command =
    e.results[0][0]
    .transcript;

    status.innerHTML =
    "You: " + command;

    const ans =
    reply(command);

    response.innerHTML =
    ans;

    speak(ans);
};

recognition.onend = () => {

    listening = false;
    btn.disabled = false;
};

recognition.onerror = () => {

    listening = false;
    btn.disabled = false;

    status.innerHTML =
    "Mic Error";
};

</script>

</body>
</html>
